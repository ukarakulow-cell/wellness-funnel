<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Results - LUMINA</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #fafafa; margin: 0; color: #333; text-align: center; }
        
        /* --- Yükleme Ekranı (Loader) --- */
        #loader { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: white; z-index: 1000; position: fixed; width: 100%; top: 0; left: 0; }
        .spinner { border: 6px solid #f3f3f3; border-top: 6px solid #3b82f6; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loader h2 { font-size: 24px; color: #111; }

        /* --- Ana İçerik --- */
        #main-content { display: none; padding: 40px 20px; }
        .container { background: white; max-width: 500px; margin: 0 auto; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .headline { font-size: 26px; font-weight: 900; color: #111; margin-bottom: 10px; }
        .subheadline { font-size: 16px; color: #555; margin-bottom: 30px; line-height: 1.5; }
        
        /* Form Elemanları */
        input[type="email"], input[type="text"] { width: 100%; padding: 15px; margin-bottom: 15px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .cta-btn { background-color: #ef4444; color: white; border: none; padding: 18px; width: 100%; font-size: 20px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; text-transform: uppercase; }
        .cta-btn:hover { background-color: #dc2626; }
        
        /* CPA Telefon Kutusu */
        .cpa-box { background: #f8fafc; border: 1px solid #cbd5e1; padding: 15px; border-radius: 8px; text-align: left; margin-bottom: 20px; }
        .cpa-label { display: flex; align-items: start; gap: 10px; font-size: 14px; font-weight: bold; color: #0f172a; cursor: pointer; }
        .cpa-label input { margin-top: 4px; transform: scale(1.2); }
        #phoneField { display: none; margin-top: 15px; }

        /* --- Çıkış Pop-up (Exit Intent) --- */
        #exitModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 40px; border-radius: 15px; max-width: 400px; text-align: center; }
        .modal-content h2 { color: #ef4444; margin-top: 0; font-size: 28px;}
        .close-btn { background: #111; color: white; padding: 10px 20px; border: none; border-radius: 5px; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <h2 id="loader-text">Analyzing your profile... 0%</h2>
</div>

<div id="main-content">
    <div class="container">
        <div class="headline">Your Personalized Action Plan is Ready!</div>
        <div class="subheadline">Enter your email below to unlock your results and claim your <b>FREE 28-Day Daily Wellness E-Book</b> ($97 Value).</div>
        
        <form method="POST">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Enter your best email address" required>
            
            <div class="cpa-box">
                <label class="cpa-label">
                    <input type="checkbox" id="cpaCheckbox">
                    <span>🔥 YES! Text me a 30% OFF Coupon and enter me into the $500 Lululemon Sweepstakes instantly!</span>
                </label>
                <div id="phoneField">
                    <input type="text" name="phone" placeholder="Enter US Phone Number (Optional)">
                </div>
            </div>

            <button type="submit" class="cta-btn">Show My Results</button>
        </form>
    </div>
</div>

<div id="exitModal">
    <div class="modal-content">
        <h2>WAIT! 🛑</h2>
        <p>Don't leave without your FREE $97 E-Book. This page will expire soon.</p>
        <button class="close-btn" onclick="document.getElementById('exitModal').style.display='none'">I want my E-Book!</button>
    </div>
</div>

<script>
    // --- 1. Yükleme Ekranı Motoru ---
    let count = 0;
    let loaderText = document.getElementById("loader-text");
    let interval = setInterval(() => {
        count += Math.floor(Math.random() * 15) + 5; // Rastgele hızda artsın
        if(count >= 100) { count = 100; }
        loaderText.innerText = "Analyzing your profile... " + count + "%";
        
        if (count === 100) {
            clearInterval(interval);
            setTimeout(() => {
                document.getElementById("loader").style.display = "none";
                document.getElementById("main-content").style.display = "block";
            }, 500);
        }
    }, 300);

    // --- 2. Checkbox (Telefon Kutusunu Aç/Kapat) ---
    document.getElementById('cpaCheckbox').addEventListener('change', function() {
        document.getElementById('phoneField').style.display = this.checked ? 'block' : 'none';
    });

    // --- 3. Çıkış Niyeti (Exit-Intent) Motoru ---
    let popupShown = false;
    document.addEventListener('mouseleave', function(e) {
        // Kullanıcının faresi ekranın en üstüne (sekme kapatmaya) giderse
        if(e.clientY < 0 && !popupShown && document.getElementById("main-content").style.display === "block") {
            document.getElementById('exitModal').style.display = 'flex';
            popupShown = true; // Sadece bir kere çalışsın
        }
    });
</script>

</body>
</html>
